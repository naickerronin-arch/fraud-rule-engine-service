apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-fraud-engine
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          parse_mode: HTML
          # the summary is written for the firing case, so the resolved
          # message gets its own wording instead of re-using it at zero
          message: |
            {{ if eq .Status "firing" }}🔴 <b>{{ .CommonLabels.alertname }}</b>
            {{ range .Alerts }}{{ .Annotations.summary }}

            <b>What to do</b>
            {{ .Annotations.action }}
            {{ end }}{{ else }}🟢 <b>Back to normal: {{ .CommonLabels.alertname }}</b>
            No new dead letters in the last 5 minutes.
            {{ end }}
            <a href="{{ .ExternalURL }}/alerting/list">Open Grafana</a>
        disableResolveMessage: false
