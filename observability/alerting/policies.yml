apiVersion: 1

# provisioning the policy tree replaces Grafana's default one
policies:
  - orgId: 1
    receiver: telegram
    group_by: [alertname]
    routes:
      - receiver: telegram
        object_matchers:
          - [channel, =, telegram]
        group_wait: 30s
        # one message per incident: the value in the summary changes on every
        # evaluation, and without a long group_interval that re-sends each time
        group_interval: 1h
        repeat_interval: 6h
