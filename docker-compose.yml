services:
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8888:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DEX_ISSUER_URI: http://dex:5556
    depends_on:
      dex:
        condition: service_started
      fraud-engine-service:
        condition: service_healthy

  login-service:
    build:
      context: ./login-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      DEX_ISSUER_URI: http://dex:5556
      DEX_CLIENT_SECRET: ${DEX_CLIENT_SECRET:-local-secret}
      GATEWAY_EXTERNAL_URL: ${GATEWAY_EXTERNAL_URL:-http://localhost:8888}
    depends_on:
      dex:
        condition: service_started

  dex:
    image: dexidp/dex:latest-alpine
    command: [ "dex", "serve", "/etc/dex/config.yaml" ]
    environment:
      DEX_CLIENT_SECRET: ${DEX_CLIENT_SECRET:-local-secret}
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro

  fraud-engine-service:
    build:
      context: ./fraud-engine-service
    depends_on:
      fraud-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      dex:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      ENVIRONMENT: ${ENVIRONMENT:-local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://fraud-db:5432/fraud
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      DEX_ISSUER_URI: http://dex:5556
      GATEWAY_EXTERNAL_URL: ${GATEWAY_EXTERNAL_URL:-http://localhost:8888}
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8081/fraud-service/actuator/health" ]
      interval: 15s
      timeout: 15s
      retries: 60
      start_period: 60s

  fraud-db:
    image: postgres:18
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fraud" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ${ENVIRONMENT:-local}-transaction-created --partitions 6 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ${ENVIRONMENT:-local}-transaction-created-dlt --partitions 6 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ${ENVIRONMENT:-local}-fraud-check-complete --partitions 6 --replication-factor 1

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
