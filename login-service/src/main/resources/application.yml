server:
  port: 8090
  servlet:
    context-path: /dexLogin

spring:
  application:
    name: login-service

app:
  dexConfig:
    baseUrl: ${DEX_BASE_URL:http://dex:5556}
    clientSecret: ${DEX_CLIENT_SECRET:local-secret}
    clientId: ${DEX_CLIENT_ID:login-service}

gateway:
  external-url: ${GATEWAY_EXTERNAL_URL:http://localhost:8080}
