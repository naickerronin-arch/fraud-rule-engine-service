server:
  port: 8080

spring:
  application:
    name: api-gateway
  web:
    resources:
      add-mappings: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DEX_ISSUER_URI:http://dex:5556}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          routes:
            - id: fraud-engine-service
              uri: http://fraud-engine-service:8081
              predicates:
                - Path=/fraud-service/**

            - id: login-service
              uri: http://login-service:8090
              predicates:
                - Path=/dexLogin/**

app:
  security-config:
    login-paths:
      - /dexLogin/**
    compliance-team-paths:
      - /fraud-service/admin/transactions/*/override

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

otel:
  service:
    name: ${spring.application.name}
  traces:
    exporter: otlp
  metrics:
    exporter: none # already have Micrometer -> Prometheus for metrics; avoid a
                    # second, redundant metrics pipeline through OTel.
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: http://tempo:4318

logging:
  pattern:
    console: "%d{ISO8601} [%X{traceId}] %-5level %logger{36} - %msg%n"
